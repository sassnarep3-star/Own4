name: nfl-lines verify

# Scope: nfl-lines/** only. Owned by session arena/b4aafa88-own4.
#
# What this guarantees, in order:
#   1. the third-party archive still matches the official NFL.com transcription;
#   2. the committed pages are exactly what the committed derived data produces
#      (catches a page that was regenerated and not committed, or vice versa);
#   3. the whole numeric pipeline still runs end to end from the pinned archive;
#   4. the rebuilt site has no broken link and no data row without a source link.
#
# It deliberately does NOT byte-compare the numerically-derived outputs. The
# pipeline is deterministic on a given machine, but BLAS/LAPACK and NumPy builds
# differ between runners and can move the last bits of a ridge fit, so a hard
# hash on those files would fail for reasons that have nothing to do with the
# science. Their correctness is covered by (1), (3) and (4) instead.

on:
  push:
    branches: [main]
    paths:
      - 'nfl-lines/**'
      - '.github/workflows/nfl-lines.yml'
  pull_request:
    paths:
      - 'nfl-lines/**'
      - '.github/workflows/nfl-lines.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas

      - name: Verify the archive against the official transcription
        working-directory: nfl-lines
        run: python3 engine/ci_check.py

      - name: Rebuild the site from the committed derived data
        working-directory: nfl-lines
        run: python3 engine/build_site.py

      - name: Check the committed pages match the committed data
        run: |
          changed=0
          for f in $(git ls-files 'nfl-lines/pages/*.html' 'nfl-lines/index.html'); do
            cur=$(sha256sum "$f" | cut -d' ' -f1)
            old=$(git show "HEAD:$f" | sha256sum | cut -d' ' -f1)
            if [ "$cur" != "$old" ]; then echo "::error::page out of sync with committed data: $f"; changed=1; fi
          done
          if [ "$changed" != "0" ]; then
            echo "Run 'python3 engine/build_site.py' in nfl-lines/ and commit the result."
          fi
          exit $changed

      - name: Rebuild derived data from the pinned archive
        working-directory: nfl-lines
        run: python3 run_all.py

      - name: Rebuild the site from the freshly derived data
        working-directory: nfl-lines
        run: python3 engine/build_site.py

      - name: Repository audit (read only)
        working-directory: nfl-lines
        run: python3 engine/repo_audit.py

      - name: Verify links and row-level source coverage
        working-directory: nfl-lines
        run: python3 engine/verify_site.py
