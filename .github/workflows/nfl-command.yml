name: nfl-command verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute derived data
        run: python3 nfl-command/engine/run.py
      - name: Rebuild site
        run: python3 nfl-command/engine/build_site.py
      - name: Verify rows source-linked and links intact
        run: python3 nfl-command/engine/verify_site.py
      - name: Determinism gate (pages must match committed)
        run: git diff --exit-code -- nfl-command/pages nfl-command/index.html
