name: nfl-readiness verify

# Gate for the nfl-readiness namespace (session arena/d941f3c1-own4, scope D1-D12).
# It rebuilds every published number from the checked-in artefacts and then enforces the
# publication contract, so a reviewer can see that the site is a function of the data and not
# of somebody's typing:
#   * engine/capture.py  - structural validation of the Week 10 availability transcription
#                          (field set, contiguous club blocks, fixture pairing, blanks preserved,
#                          vocabulary); FAIL exits non-zero;
#   * engine/audit.py    - re-derives the census, the peer-capture reconciliation, the standings
#                          identities and the intra-week designation delta into data/derived/*;
#   * engine/drift.py    - the row-count / required-field / vocabulary alarm the brief asks for,
#                          plus the transcription hashes published on the evidence page;
#   * engine/repo_review.py - the namespace inventory on the repository-review page;
#   * engine/originate.py --probe - proves the origination-order guard (side -> total -> moneyline)
#                          and the three-column contract actually fire, so the guard is live and
#                          not decorative;
#   * engine/preregister.py --check - every registered rule must still match the hash frozen at
#                          its registration commit: a rule edited after registration fails CI;
#   * engine/build_site.py - regenerates the pages from the artefacts;
#   * engine/verify_site.py - link resolution, per-row source-or-UNVERIFIED, the no-price rule
#                          (no official price source exists, so a price value in the HTML is a
#                          build failure), index/artefact agreement and the register vocabulary.
# The determinism step is the one that matters most: if a committed page does not equal the output
# of the engines on the checked-in data, the number on the site is not reproducible and must not
# publish. This workflow does not deploy - Pages serves this repository through the existing
# legacy main/root configuration.
#
# It deliberately does NOT try to fetch nfl.com: no collector is wired up yet, and a workflow that
# re-fetched a live page would fail for reasons unrelated to the code (see SUG-02 and flag RF-16,
# which record that the cadence the brief assumes does not exist).

on:
  push:
    paths:
      - 'nfl-readiness/**'
      - 'verification/build.py'
      - '.github/workflows/nfl-readiness.yml'
  pull_request:
    paths:
      - 'nfl-readiness/**'
      - 'verification/build.py'
      - '.github/workflows/nfl-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # needed so preregister.py can read the blob at the registration commit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate the transcribed availability capture
        working-directory: nfl-readiness
        run: python3 engine/capture.py

      - name: Re-derive census, cross-capture reconciliation, standings checks, delta
        working-directory: nfl-readiness
        run: python3 engine/audit.py

      - name: Drift alarm + transcription hashes
        working-directory: nfl-readiness
        run: python3 engine/drift.py

      - name: Namespace inventory
        working-directory: nfl-readiness
        run: python3 engine/repo_review.py

      - name: Origination-order guard must fire (probe)
        working-directory: nfl-readiness
        run: python3 engine/originate.py --probe

      - name: Pre-registration ledger must be intact
        working-directory: nfl-readiness
        run: python3 engine/preregister.py --check

      - name: Rebuild pages from the artefacts
        working-directory: nfl-readiness
        run: python3 engine/build_site.py

      - name: Verify rows, links, price rule and register vocabulary
        working-directory: nfl-readiness
        run: python3 engine/verify_site.py

      - name: Rebuild the canonical site with the readiness navigation
        run: |
          python3 verification/build.py
          python3 verification/verify_site.py

      - name: Determinism gate (rebuild must not change committed files)
        run: git diff --exit-code -- nfl-readiness/index.html nfl-readiness/pages nfl-readiness/assets index.html verified
