name: nfl-readiness verify
on:
  push:
    paths: ['nfl-readiness/**', '.github/workflows/nfl-readiness.yml']
  pull_request:
    paths: ['nfl-readiness/**', '.github/workflows/nfl-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute every published figure from the official observations
        working-directory: nfl-readiness/engine
        run: python3 derive.py
      - name: Rebuild the decision-readiness table
        working-directory: nfl-readiness/engine
        run: python3 readiness.py
      - name: Rebuild the site
        working-directory: nfl-readiness/engine
        run: python3 build_site.py
      - name: Verify sources, blanks, links, data invariants and determinism
        working-directory: nfl-readiness/engine
        run: python3 verify.py
      - name: Determinism gate (a rebuild must not change committed output)
        run: git diff --exit-code -- nfl-readiness
