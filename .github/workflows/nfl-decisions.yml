name: NFL decision desk
on:
  push:
    paths: ['nfl-decisions/**', '.github/workflows/nfl-decisions.yml']
  pull_request:
    paths: ['nfl-decisions/**', '.github/workflows/nfl-decisions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 nfl-decisions/build.py
      - run: python3 nfl-decisions/verify.py
      - run: node --check nfl-decisions/filter.js
      - run: git diff --exit-code -- nfl-decisions
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy existing repository and NFL decision hub
        id: deployment
        uses: actions/deploy-pages@v4
