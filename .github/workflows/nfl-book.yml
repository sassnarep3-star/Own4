name: nfl-book verify
on:
  push:
    paths: ['nfl-book/**', '.github/workflows/nfl-book.yml']
  pull_request:
    paths: ['nfl-book/**', '.github/workflows/nfl-book.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild results feed and run verification checks
        working-directory: nfl-book/engine
        run: python3 ingest.py
      - name: Originate lines (side -> total -> moneyline) and price snapshots
        working-directory: nfl-book/engine
        run: python3 originate.py
      - name: Walk-forward backtest + leaderboard
        working-directory: nfl-book/engine
        run: python3 backtest.py
      - name: Correlations (official inputs only)
        working-directory: nfl-book/engine
        run: python3 correlations.py
      - name: Gap-closure datasets (requirements, removal-of-luck, availability, PIT ledger, …)
        working-directory: nfl-book/engine
        run: python3 expand.py
      - name: Rebuild site
        working-directory: nfl-book/engine
        run: python3 build_site.py
      - name: Verify every row source-linked, blanks marked, links resolve
        working-directory: nfl-book/engine
        run: python3 verify.py
      - name: Determinism gate (rebuild must not change committed pages)
        run: git diff --exit-code -- nfl-book/pages nfl-book/index.html
