name: Validate SF rental dashboard
on:
  push:
    paths: ['rental-review/**', 'verification/build.py', 'index.html', '.github/workflows/rental-review.yml']
  pull_request:
    paths: ['rental-review/**', 'verification/build.py', 'index.html', '.github/workflows/rental-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python rental-review/test_site.py
      - run: git diff --exit-code -- rental-review
