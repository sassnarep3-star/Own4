name: fetch-nba-data

# Pulls official NBA data (cdn.nba.com / stats.nba.com / nba.com) and
# commits raw JSON + provenance manifest to the session branch.
# Trigger manually from the Actions tab or via `gh workflow run`.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/75685c60-own4
    paths:
      - scripts/fetch_official.py
      - .github/workflows/fetch-nba-data.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: arena/75685c60-own4

      - name: Fetch official NBA data
        run: |
          python3 scripts/fetch_official.py 2>&1 | tee fetch.log
          echo "--- summary ---"
          python3 - <<'PY'
          import json
          m = json.load(open("data/manifest.json"))
          ok = sum(1 for i in m["items"] if i["http_status"] == 200)
          print(f"total={len(m['items'])} ok={ok} fail={len(m['items'])-ok}")
          for i in m["items"]:
              if i["http_status"] != 200:
                  print(f"  FAIL {i['http_status']} {i['source_url']}")
          PY

      - name: Commit fetched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ fetch.log || true
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: automated fetch of official NBA data [skip ci]"
            git pull --rebase origin arena/75685c60-own4
            git push origin arena/75685c60-own4
          fi
