name: nfl-w11-delta verify

# Verifies the Week 11 official injury-report delta workspace (nfl-w11-delta/):
# raw-capture hash against the manifest, re-derived row counts, closed vocabularies,
# official-link coverage on every table row, and a byte-identical rebuild.
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute delta from the stored raw capture and transcription
        run: python3 nfl-w11-delta/engine/delta.py
      - name: Rebuild site
        run: python3 nfl-w11-delta/engine/build.py
      - name: Verify (hashes, counts, vocabularies, official links, determinism)
        run: python3 nfl-w11-delta/engine/verify.py
      - name: Determinism gate (pages and delta must match committed)
        run: git diff --exit-code -- nfl-w11-delta
