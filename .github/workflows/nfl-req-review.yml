name: nfl-req-review verify
on:
  push:
    paths: ['nfl-req-review/**', '.github/workflows/nfl-req-review.yml']
  pull_request:
    paths: ['nfl-req-review/**', '.github/workflows/nfl-req-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild round-2 reads, register, questions, suggestions and pages
        run: |
          python3 nfl-req-review/engine/round2.py
          python3 nfl-req-review/engine/round2_register.py
          python3 nfl-req-review/engine/build_r2.py
      - name: Verify links, sourcing, artifacts, computed checks, determinism
        run: python3 nfl-req-review/engine/verify_r2.py
      - name: Determinism gate (rebuild must not change committed files)
        run: git diff --exit-code -- nfl-req-review/pages nfl-req-review/index.html nfl-req-review/EXECUTIVE_SUMMARY.md nfl-req-review/assets nfl-req-review/data
